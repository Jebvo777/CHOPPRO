name: Мобильные приложения
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'tools/package_mobile.py', 'tools/mobile_android_smoke.py', 'tools/mobile_ios_tests.*', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve platform dependencies
        working-directory: mobile
        run: |
          npm ci
          npx expo install --check
          npm audit --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CHOPPRO-mobile-dependencies
          path: |
            mobile/package.json
            mobile/package-lock.json
            mobile/dependency-audit.json
      - name: TypeScript and queue scenarios
        working-directory: mobile
        run: npm run typecheck && npm test
      - name: Universal browser build
        working-directory: mobile
        run: npm run export:web
      - name: Prepare native projects
        working-directory: mobile
        run: npx expo prebuild --no-install
      - uses: actions/upload-artifact@v4
        with:
          name: CHOPPRO-mobile-prepared
          path: |
            mobile/package.json
            mobile/package-lock.json
            mobile/android/
            mobile/ios/
            mobile/dist/
  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GRADLE_OPTS: '-Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: CHOPPRO-mobile-prepared
          path: mobile
      - name: Install locked dependencies
        working-directory: mobile
        run: npm ci
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone Android
        id: android_build
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch standalone Android application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n ru.choppro.guard/.MainActivity
            adb shell pidof ru.choppro.guard
            python3 tools/mobile_android_smoke.py
      - name: Package Android project
        if: ${{ always() && steps.android_build.conclusion == 'success' }}
        run: python3 tools/package_mobile.py --platform android --sha "$GITHUB_SHA" --output dist/CHOPPRO_Android.zip
      - name: Include application
        if: ${{ always() && steps.android_build.conclusion == 'success' }}
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk dist/CHOPPRO_Android_test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CHOPPRO-Android
          path: dist/
  ios:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: CHOPPRO-mobile-prepared
          path: mobile
      - name: Select current Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -Vr | head -n1)/Contents/Developer"
      - name: Install locked dependencies and pods
        working-directory: mobile
        run: npm ci && npx pod-install
      - name: Build iOS simulator application
        id: ios_build
        working-directory: mobile
        run: |
          mobile_workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          mobile_scheme=$(basename "$mobile_workspace" .xcworkspace)
          xcodebuild -workspace "$mobile_workspace" -scheme "$mobile_scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-
      - name: Launch standalone iOS application
        run: |
          mobile_simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in reversed(list(d["devices"].values())) for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$mobile_simulator"
          xcrun simctl bootstatus "$mobile_simulator" -b
          xcrun simctl install "$mobile_simulator" mobile/ios-build/Build/Products/Release-iphonesimulator/*.app
          xcrun simctl launch "$mobile_simulator" ru.choppro.guard
          mkdir -p dist
          sleep 8
          xcrun simctl io "$mobile_simulator" screenshot dist/CHOPPRO_iOS_screen.png
          xcrun simctl spawn "$mobile_simulator" launchctl list | grep ru.choppro.guard
          ruby tools/mobile_ios_tests.rb
          mobile_workspace=$(find mobile/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          xcodebuild test -workspace "$mobile_workspace" -scheme MobileChecks -configuration Release -destination "id=$mobile_simulator" -derivedDataPath mobile/ios-build -resultBundlePath dist/CHOPPRO_iOS_checks.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-
          xcrun simctl io "$mobile_simulator" screenshot dist/CHOPPRO_iOS_screen.png
          xcrun simctl shutdown "$mobile_simulator"
      - name: Package iOS project
        if: ${{ always() && steps.ios_build.conclusion == 'success' }}
        run: |
          python3 tools/package_mobile.py --platform ios --sha "$GITHUB_SHA" --output dist/CHOPPRO_iOS.zip
          ditto -c -k --sequesterRsrc --keepParent mobile/ios-build/Build/Products/Release-iphonesimulator/*.app dist/CHOPPRO_iOS_simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CHOPPRO-iOS
          path: dist/
