name: Диаграммы из актуальных PUML
on:
  push:
    branches: [main]
    paths:
      - 'docs/диаграммы/*.puml'
      - 'acceptance-portal/bin/render_diagrams.py'
      - '.github/workflows/diagrams.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: diagrams-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Установка PlantUML и Graphviz
        run: sudo apt-get update && sudo apt-get install -y plantuml graphviz
      - name: Рендер SVG и PNG
        run: python3 acceptance-portal/bin/render_diagrams.py
      - name: Сохранить рендеры с SHA исходников
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/диаграммы
          if ! git diff --cached --quiet; then
            git commit -m 'Диаграммы: автоматически обновить SVG/PNG из PUML'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
