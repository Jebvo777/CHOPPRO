name: Диаграммы из актуальных PUML
on:
  push:
    branches: [main]
    paths:
      - 'docs/диаграммы/*.puml'
      - 'acceptance-portal/bin/render_diagrams.py'
      - '.github/workflows/diagrams.yml'
  pull_request:
    paths:
      - 'docs/диаграммы/*.puml'
      - 'acceptance-portal/bin/render_diagrams.py'
      - '.github/workflows/diagrams.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: diagrams-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Установка PlantUML и Graphviz
        run: sudo apt-get update && sudo apt-get install -y plantuml graphviz
      - name: Рендер SVG и PNG
        run: python3 acceptance-portal/bin/render_diagrams.py
      - uses: actions/upload-artifact@v4
        with:
          name: CHOPPRO-diagrams
          path: docs/диаграммы
      - name: Сохранить рендеры с SHA исходников
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/диаграммы
          if ! git diff --cached --quiet; then
            git commit -m 'Изменено отображение диаграмм'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
