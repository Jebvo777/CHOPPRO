# Insert these locations into the server block that serves the portal.
# The root and PHP-FPM socket below are examples; use the paths on your hosting.
root /var/www/choppro-portal;
index index.php;

location ~ ^/(app|bootstrap|storage|tests|bin|deploy)(/|$) { deny all; }
location ~ ^/(config\.php|portal\.json|\.env.*|.*\.md)$ { deny all; }
location / { try_files $uri $uri/ /index.php?$query_string; }
location ~ \.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $portal_path_info $fastcgi_path_info;
    try_files $fastcgi_script_name =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $portal_path_info;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
