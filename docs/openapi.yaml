openapi: 3.0.3
info:
  title: ЧОППРО API
  version: 2.2.0
  description: Реализованный API этапа 2. Базовый путь /v1. На shared hosting запрос передаётся через demo-api.php?space=admin|client|platform|jobs&path=/v1/…;
    HTTP-метод, тело, Bearer/сессия и CSRF сохраняются. Уведомления через платные внешние сервисы — этап 4. Хранение
    — 3 года по политике данных. Нативный интерфейс — этап 3. Глобальный поиск соблюдает права и область объектов.
    Документы имеют inline PDF-просмотр; недельный планировщик переносит только черновики с проверкой версии, пересечений
    и времени.
servers:
- url: /v1
security:
- BearerAuth: []
- SessionCookie: []
tags:
- name: Система
- name: Авторизация
- name: Аналитика
- name: Присутствие
- name: Платформа
- name: Аудит
- name: Хранение
- name: Ресурсы
- name: Кадры
- name: Смены
- name: Заказчик
- name: Биржа труда
- name: Назначения
- name: График смен
- name: Шаблоны смен
- name: Документы сотрудников
- name: Договоры
- name: Контроль сроков
- name: Вакансии
- name: QR-точки
- name: Инструкции
- name: Отчёты заказчика
- name: Пользователи
- name: Виды услуг
- name: Правила контроля
- name: Шаблоны договоров
- name: Импорт
- name: Лицензии
paths:
