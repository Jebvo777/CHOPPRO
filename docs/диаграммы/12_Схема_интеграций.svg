@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Times New Roman"
left to right direction
rectangle "ЧОППРО\nPHP REST API" as API
rectangle "Outbox / Worker" as Worker
database "MySQL 8" as DB
rectangle "Redis" as Redis
cloud "SMS / OTP" as SMS
cloud "Email / Telegram / Web Push" as EXT
cloud "Mobile Push\nAndroid / iOS" as PUSH
cloud "Карты / геокодер" as MAPS
cloud "S3 РФ" as S3
cloud "Антивирус" as AV
rectangle "XLSX/CSV для 1С" as ERP
API - -> DB
API - -> Redis
API - -> S3
S3 - -> AV
API - -> Worker
Worker - -> SMS
Worker - -> EXT
Worker - -> PUSH
API - -> MAPS
API - -> ERP
@enduml

