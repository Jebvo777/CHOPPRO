ly="Times New Roman" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="231" x="424.5" y="341.4263">Создать AuthSession (token_hash)</text><polygon fill="#383838" points="245,371.625,235,375.625,245,379.625,241,375.625" style="stroke: #383838; stroke-width: 1.0;"/><line style="stroke: #383838; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="239" x2="416.5" y1="375.625" y2="375.625"/><text fill="#000000" font-family="Times New Roman" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="133" x="251" y="370.5591">access/refresh token</text><!--MD5=[9447f493a7d7adbacc324bffe8b57e00]
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Times New Roman"
actor "Охранник" as Guard
participant "Мобильное приложение Android/iOS" as Mobile
participant "PHP API" as API
participant "OTP Adapter" as OTP
database "MySQL" as DB
Guard -> Mobile: Ввод телефона
Mobile -> API: POST /auth/otp/request
API -> OTP: Отправить код
OTP - -> API: provider_message_id
API - -> Mobile: challenge_id
Guard -> Mobile: Ввод OTP
Mobile -> API: POST /auth/otp/verify
API -> DB: Проверить challenge / user / tenant
API -> DB: Создать AuthSession (token_hash)
API - -> Mobile: access/refresh token
@enduml

